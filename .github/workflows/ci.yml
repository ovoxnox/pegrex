name: gate

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pegrex-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      # Dependencies are installed in a setup container before any repository
      # Python is executed. Commit that environment, then run the source in a new
      # networkless, capability-restricted container with no secrets or Docker socket.
      - name: Prepare dependency image (do not execute repository code)
        run: |
          docker pull python:3.12-slim@sha256:aa943ce411423c7582288f18707ff66eddcbaeb510502d747a72aeb34f30d159
          docker run -d --name pegrex-ci-setup --network bridge python:3.12-slim@sha256:aa943ce411423c7582288f18707ff66eddcbaeb510502d747a72aeb34f30d159 sleep infinity
          docker cp requirements-ci.txt pegrex-ci-setup:/tmp/requirements-ci.txt
          docker exec pegrex-ci-setup sh -eu -c \
            'apt-get update && apt-get install -y --no-install-recommends git gcc && rm -rf /var/lib/apt/lists/* && python -m pip install --no-cache-dir --requirement /tmp/requirements-ci.txt'
          docker commit pegrex-ci-setup pegrex-ci-image
          docker rm -f pegrex-ci-setup
      - name: Start isolated offline test container
        run: |
          docker run -d --name pegrex-ci-tests --network none \
            --cap-drop ALL --security-opt no-new-privileges --pids-limit 512 \
            --memory 6g --cpus 2 --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=1g \
            -e HOME=/tmp -e PYTHONDONTWRITEBYTECODE=1 \
            --mount type=bind,src="$GITHUB_WORKSPACE",dst=/workspace \
            -w /workspace pegrex-ci-image sleep infinity
      - name: Verify source manifest (offline, isolated)
        run: docker exec pegrex-ci-tests python tools/build_release.py /tmp/pegrex-ci-release.zip
      - name: Full test suite shard (offline, isolated, bounded job)
        run: docker exec pegrex-ci-tests python tools/run_test_shard.py --shard ${{ matrix.shard }} --shards 4
      - name: Grammar lint (offline, isolated)
        run: docker exec pegrex-ci-tests python tools/grammar_lint.py examples/*.gram
      - name: Remove isolated containers
        if: always()
        run: docker rm -f pegrex-ci-tests pegrex-ci-setup || true

  static-and-reproducibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - name: Prepare dependency image (do not execute repository code)
        run: |
          docker pull python:3.12-slim@sha256:aa943ce411423c7582288f18707ff66eddcbaeb510502d747a72aeb34f30d159
          docker run -d --name pegrex-static-setup --network bridge python:3.12-slim@sha256:aa943ce411423c7582288f18707ff66eddcbaeb510502d747a72aeb34f30d159 sleep infinity
          docker cp requirements-ci.txt pegrex-static-setup:/tmp/requirements-ci.txt
          docker exec pegrex-static-setup sh -eu -c \
            'apt-get update && apt-get install -y --no-install-recommends git gcc && rm -rf /var/lib/apt/lists/* && python -m pip install --no-cache-dir --requirement /tmp/requirements-ci.txt'
          docker commit pegrex-static-setup pegrex-static-image
          docker rm -f pegrex-static-setup
      - name: Start isolated offline static-check container
        run: |
          docker run -d --name pegrex-ci-static --network none \
            --cap-drop ALL --security-opt no-new-privileges --pids-limit 512 \
            --memory 6g --cpus 2 --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=1g \
            -e HOME=/tmp -e PYTHONDONTWRITEBYTECODE=1 \
            --mount type=bind,src="$GITHUB_WORKSPACE",dst=/workspace \
            -w /workspace pegrex-static-image sleep infinity
      - name: Run static/reproducibility checks offline and isolated
        run: |
          docker exec pegrex-ci-static python -m compileall -q pegrex tools tests
          docker exec pegrex-ci-static python tools/selfhost.py --check
          docker exec pegrex-ci-static python tools/health_report.py --check
          docker exec pegrex-ci-static python tools/build_skills.py --check
          docker exec pegrex-ci-static python tools/audit_public_schemas.py --check
          docker exec pegrex-ci-static python tools/grammar_lint.py pegrex/grammars/*.gram examples/*.gram
          docker exec pegrex-ci-static python tools/ci_gate.py .
      - name: Remove isolated containers
        if: always()
        run: docker rm -f pegrex-ci-static pegrex-static-setup || true
