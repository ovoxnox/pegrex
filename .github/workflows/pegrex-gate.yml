name: pegrex-gate

# Historical cognitive-complexity debt is reported; pull-request files changed
# from the base revision are gated strictly so new debt fails without rewriting history.
on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # Install tools/dependencies without importing or executing the checked-out
      # project. The actual gate runs in a separate networkless, restricted container.
      - name: Prepare dependency image (do not execute repository code)
        run: |
          docker pull python:3.12-slim@sha256:aa943ce411423c7582288f18707ff66eddcbaeb510502d747a72aeb34f30d159
          docker run -d --name pegrex-gate-setup --network bridge python:3.12-slim@sha256:aa943ce411423c7582288f18707ff66eddcbaeb510502d747a72aeb34f30d159 sleep infinity
          docker cp requirements-ci.txt pegrex-gate-setup:/tmp/requirements-ci.txt
          docker exec pegrex-gate-setup sh -eu -c \
            'apt-get update && apt-get install -y --no-install-recommends git gcc && rm -rf /var/lib/apt/lists/* && python -m pip install --no-cache-dir --requirement /tmp/requirements-ci.txt'
          docker commit pegrex-gate-setup pegrex-gate-image
          docker rm -f pegrex-gate-setup
      - name: Start isolated offline gate container
        run: |
          docker run -d --name pegrex-ci-gate --network none \
            --cap-drop ALL --security-opt no-new-privileges --pids-limit 512 \
            --memory 6g --cpus 2 --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=1g \
            -e HOME=/tmp -e PYTHONDONTWRITEBYTECODE=1 \
            --mount type=bind,src="$GITHUB_WORKSPACE",dst=/workspace \
            -w /workspace pegrex-gate-image sleep infinity
      - name: pegrex gate (offline, isolated; strict changed-file debt)
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$PR_BASE_SHA" ]; then
            docker exec pegrex-ci-gate python tools/ci_gate.py . --changed-since "$PR_BASE_SHA"
          else
            docker exec pegrex-ci-gate python tools/ci_gate.py .
          fi
      - name: Remove isolated containers
        if: always()
        run: docker rm -f pegrex-ci-gate pegrex-gate-setup || true
