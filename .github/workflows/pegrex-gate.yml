name: pegrex-gate

# The composed local/CI gate (m150) as a standalone workflow. Verdicts are
# three-valued; the gate fails loudly naming every failed check.
on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0  # verify_patch needs the PR base ref available
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked dependencies
        run: |
          python -m pip install --requirement requirements-ci.txt
          python -m pip install --no-deps --editable .
      - name: pegrex gate (cognitive budget over budget = fail)
        run: python tools/ci_gate.py --fail-on-over .
