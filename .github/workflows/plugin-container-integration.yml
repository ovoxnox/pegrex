name: trusted-plugin-container-integration

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  plugin-container:
    # This job executes the repository's test harness on the host to exercise
    # the real Docker daemon. Restrict it to the protected default branch; PR
    # code must use the isolated, networkless CI workflow instead.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned test dependencies
        run: python -m pip install --disable-pip-version-check --requirement requirements-ci.txt
      - name: Pull pinned plugin worker image
        run: docker pull python:3.12-slim@sha256:aa943ce411423c7582288f18707ff66eddcbaeb510502d747a72aeb34f30d159
      - name: Exercise real restricted Docker worker
        env:
          PEGREX_PLUGIN_TEST_IMAGE: python:3.12-slim@sha256:aa943ce411423c7582288f18707ff66eddcbaeb510502d747a72aeb34f30d159
        run: python -m pytest -q tests/test_plugin_container_integration.py
