[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pegrex"
version = "1.0.0"
description = "Self-contained symbolic-execution and syntactic-analysis engine: source -> mathematical specifications for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ovoxnox" }]
dependencies = ["pydantic>=2"]

[project.optional-dependencies]
parsers = ["tree-sitter>=0.25",
           "tree-sitter-python>=0.25",
           "tree-sitter-go>=0.25",
           "tree-sitter-rust>=0.25",
           "tree-sitter-javascript>=0.25"]
all = ["pegrex[parsers]"]

[project.scripts]
pegrex = "pegrex.cli:main"

[project.urls]
Homepage = "https://github.com/ovoxnox/pegrex"

[tool.setuptools]
packages = ["pegrex"]
include-package-data = true

[tool.setuptools.package-data]
pegrex = ["../examples/*.gram", "../pegrex/secrules*.json"]
