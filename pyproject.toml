[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pegrex"
version = "1.3.0"
description = "Self-contained symbolic-execution and syntactic-analysis engine: source -> mathematical specifications for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "ovoxnox" }]
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
parsers = ["tree-sitter>=0.25,<0.27",
           "tree-sitter-python>=0.25,<0.26",
           "tree-sitter-go>=0.25,<0.26",
           "tree-sitter-rust>=0.24,<0.25",
           "tree-sitter-javascript>=0.25,<0.26"]
evidence = ["xxhash>=3.5,<5"]
solver = ["z3-solver>=4.12,<6"]
solvers = ["z3-solver>=4.12,<6"]
pythoc = ["pythoc==0.6.0"]
ironkernel = ["ironkernel==1.0.0", "numpy>=1.24,<3"]
neural-codegen = []
integrations = ["pythoc==0.6.0", "ironkernel==1.0.0", "numpy>=1.24,<3"]
test = ["pytest>=8,<10", "hypothesis>=6.140,<7"]
all = ["tree-sitter>=0.25,<0.27",
       "tree-sitter-python>=0.25,<0.26",
       "tree-sitter-go>=0.25,<0.26",
       "tree-sitter-rust>=0.24,<0.25",
       "tree-sitter-javascript>=0.25,<0.26",
       "xxhash>=3.5,<5",
       "z3-solver>=4.12,<6",
       "pytest>=8,<10",
       "hypothesis>=6.140,<7"]

[project.scripts]
pegrex = "pegrex.cli:main"

[project.urls]
Homepage = "https://github.com/ovoxnox/pegrex"

[tool.setuptools]
include-package-data = true
py-modules = ["pipeline", "service"]

[tool.setuptools.packages.find]
where = ["."]
include = ["pegrex*", "tools*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
pegrex = ["secrules*.json", "grammars/*.gram", "jsonschemas/*.json"]
